<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morambol Supplies — BOQ Price Intelligence</title>
  <!-- CDN dependency (must load before app JS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    integrity="sha512-r22gChDnGvBylk90+2e/ycr+equJ8k3ZF/3gN3JN9PVyFWK7nMWcMz3aLiCBBX9P7A7l4HmBqRfQMWmLzCnH9Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/intake.css">
  <link rel="stylesheet" href="css/review.css">
  <link rel="stylesheet" href="css/processing.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>

<!-- TOP BAR — persistent across all stages -->
<nav class="topbar" aria-label="Main navigation">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-box">MOR<br>AMBOL</div>
      <div class="logo-text">
        <span class="logo-name">Morambol Supplies</span>
        <span class="logo-sub">BOQ Price Intelligence System</span>
      </div>
    </div>
    <div class="topbar-right">
      <a class="nav-link" href="#"
        onclick="toast('Powered by Serper API + FlareSolverr — Live web scraping intelligence');return false;">
        System Info
      </a>
      <span class="status-pill" id="status-pill">Ready</span>
    </div>
  </div>
</nav>

<main class="shell">

  <!-- STAGE 1 — INTAKE -->
  <div class="stage active" id="stage-upload">
    <!-- populated by steps/step-intake.html via app.js -->
  </div>

  <!-- STAGE 2 — LINE ITEM REVIEW -->
  <div class="stage" id="stage-review">
    <!-- populated by steps/step-review.html via app.js -->
  </div>

  <!-- STAGE 3 — PROCESSING -->
  <div class="stage" id="stage-processing">
    <!-- populated by steps/step-processing.html via app.js -->
  </div>

  <!-- STAGE 4 — REPORT -->
  <div class="stage" id="stage-report">
    <!-- populated by steps/step-report.html via app.js -->
  </div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- JS — order is critical -->
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/labour.js"></script>
<script src="js/compliance.js"></script>
<script src="js/intake.js"></script>
<script src="js/review.js"></script>
<script src="js/processing.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>

</body>
</html>
