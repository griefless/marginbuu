<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="css/styles.css">

<script src="js/state.js"></script><script src="js/utils.js"></script><script src="js/labour.js"></script>

<script>
KH_PROCESSING.renderProgress();
document.getElementById("run-research").onclick=KH_PROCESSING.runResearch;
document.getElementById("to-review").onclick=()=>KH_APP.confirmAdvance(3,"zone-4-review.html");
</script>
