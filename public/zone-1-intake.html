<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHUTHADZO SUPPLIES — Zone 1 Intake</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<header class="kh-header"><span class="brand-mark">KHUTHADZO</span><h1>SUPPLIES — QS Workbench</h1></header>
<nav class="kh-nav"></nav>
<main>
  <div id="freshness-banner"></div>
  <div class="kh-card">
    <h2>Zone 1 — Document Ingestion & Intelligence Layer</h2>
    <p>Upload a BOQ / RFQ (XLSX, XLS, CSV, DOCX, PDF, image) or paste raw text. Pricing begins only after you confirm the interpretation.</p>
    <div class="field"><label>Upload file</label><input type="file" id="file-input"></div>
    <div class="field"><label>…or paste raw text</label><textarea id="paste-input" rows="5"></textarea></div>
    <button class="btn" id="parse-btn">Parse Document</button>
    <p id="intake-status"></p>
    <div class="progress-bar" id="ocr-bar"><span></span></div>
  </div>
  <div class="kh-card" id="intelligence-card">
    <h2>Ingestion Intelligence Report</h2>
    <div id="intelligence-report"><em>Awaiting parse…</em></div>
    <button class="btn btn-accent" id="confirm-intake" disabled>Confirm Interpretation → Zone 2</button>
  </div>
</main>

<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/labour.js"></script>
<script src="js/compliance.js"></script>
<script src="js/intake.js"></script>
<script src="js/review.js"></script>
<script src="js/processing.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("parse-btn").onclick = async () => {
  const file = document.getElementById("file-input").files[0];
  const paste = document.getElementById("paste-input").value.trim();
  if (file) {
    const reader = new FileReader();
    reader.onload = () => KH_INTAKE.ingest({ filename: file.name, contentBase64: reader.result.split(",")[1], size: file.size });
    reader.readAsDataURL(file);
  } else if (paste) {
    KH_INTAKE.ingest({ text: paste });
  } else alert("Provide a file or paste text.");
};
document.getElementById("confirm-intake").onclick = KH_INTAKE.confirmIntake;
</script>
</body></html>
