<div class="shell" style="max-width:1200px">
  <div class="review-stage">

    <!-- Review header -->
    <div class="review-head">
      <h3 id="review-title">Review Extracted Line Items</h3>
      <div class="review-meta" id="review-meta"></div>
    </div>

    <!-- Category filter chips -->
    <div class="cat-filter-panel">
      <div class="cat-filter-title">Filter by Category</div>
      <div class="cat-filter-grid" id="cat-filter-grid"></div>
    </div>

    <!-- Two-tab toggle -->
    <div class="review-tab-row" role="tablist">
      <button class="review-tab-btn active" role="tab" id="rtab-items-btn"
        onclick="switchReviewTab('items',this)">
        Line Items (<span id="rtab-items-count">0</span>)
      </button>
      <button class="review-tab-btn" role="tab" id="rtab-excluded-btn"
        onclick="switchReviewTab('excluded',this)">
        Excluded Rows (<span id="rtab-excluded-count">0</span>)
      </button>
    </div>

    <!-- Tab 1: Line Items -->
    <div class="review-tab-panel active" id="rtab-items" role="tabpanel">
      <div class="review-tbl-wrap">
        <table class="review" id="review-tbl">
          <thead><tr>
            <th style="width:52px">Item No</th>
            <th style="width:90px">Section</th>
            <th>Description</th>
            <th style="width:140px">Context Note</th>
            <th style="width:100px">Category</th>
            <th style="width:52px;text-align:center">Unit</th>
            <th style="width:52px;text-align:right">Qty</th>
            <th style="width:72px">Type</th>
            <th style="width:68px">Confidence</th>
            <th style="width:80px">Flags</th>
          </tr></thead>
          <tbody id="review-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab 2: Excluded Rows -->
    <div class="review-tab-panel" id="rtab-excluded" role="tabpanel">
      <div class="review-tbl-wrap">
        <table class="review" id="excluded-tbl">
          <thead><tr>
            <th style="width:60px">Item No</th>
            <th>Description</th>
            <th style="width:120px">Classified As</th>
            <th style="width:80px">Confidence</th>
            <th style="width:100px">Action</th>
          </tr></thead>
          <tbody id="excluded-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Confirmation gate -->
    <div class="confirm-gate">
      <input type="checkbox" id="review-confirmed" onchange="toggleSearchBtn()">
      <label for="review-confirmed">
        I have reviewed the parsed items and confirmed the line items are correct
      </label>
    </div>

  </div><!-- /review-stage -->
</div>

<!-- Sticky footer nav — always reachable without scrolling -->
<div class="review-footer-bar">
  <button class="btn btn-outline" onclick="setStage('stage-upload')">← Back</button>
  <button class="btn btn-primary" id="proceed-btn" disabled onclick="proceedToAnalysis()">
    Search &amp; Analyse Prices
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>
  </button>
</div>
